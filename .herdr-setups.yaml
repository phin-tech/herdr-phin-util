# Setups committed with the repo, so every checkout and worktree of it has
# them. This file is the "shared" source: setups/ and repos/ in the plugin
# config directory are per-machine, this one travels.
setups:
  - name: verify
    description: the check this repo expects before a push
    tabs:
      - name: verify
        panes:
          - agent: claude
            focus: true
            prompt: |
              Run go test ./... and go vet ./... in the pane beside you, then
              fix whatever fails. Do not commit.
          - split: right
            command: go test ./... && go vet ./...

  - name: sandboxed-python
    description: try the secure-python nono profile — a Claude Code pane sandboxed by it, and a bare python3 REPL beside it
    applies_to: [plain, project]
    tabs:
      - name: sandboxed
        panes:
          - label: claude-sandboxed
            focus: true
            command: nono run --profile .nono/secure-python.json --extends claude-code --allow-cwd -- claude
          - split: right
            label: python
            command: nono run --profile .nono/secure-python.json --allow-cwd -- python3
